<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Générer un Rétroplanning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">

        <!-- HEADER ADMIN -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-teal-600 text-white px-5 py-2 rounded-full text-sm font-semibold mb-4">
                🔐 MODE ADMINISTRATEUR
            </div>
            <h1 class="text-3xl font-bold text-slate-800">🗓️ Générer un Rétroplanning</h1>
            <p class="text-slate-500 mt-1">Génération gratuite — Accès réservé Omnipub</p>
        </header>

        <form action="/admin/generate" method="POST" class="space-y-6">

            <!-- INFORMATIONS GÉNÉRALES -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📌 Informations générales</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nom du client *</label>
                        <input type="text" name="client" required
                               placeholder="Ex : Mairie de Montpellier"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nom de l'événement *</label>
                        <input type="text" name="evenement" required
                               placeholder="Ex : Salon du Marketing 2026"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>
            </div>

            <!-- 4 ÉTAPES -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📋 Les 4 étapes clés</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    {% for i in range(1, 5) %}
                    <div class="p-3 border border-slate-200 rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-teal-600 uppercase tracking-wide">Étape {{ i }}</span>
                        <input type="text" name="label{{ i }}"
                               placeholder="Libellé libre"
                               class="mt-2 block w-full text-sm border border-slate-300 rounded-md px-2 py-1 mb-2 focus:outline-none focus:ring-1 focus:ring-teal-500">
                        <input type="date" name="date{{ i }}" required
                               class="block w-full text-sm border border-slate-300 rounded-md px-2 py-1 focus:outline-none focus:ring-1 focus:ring-teal-500">
                    </div>
                    {% endfor %}
                </div>

                <!-- DATE ÉVÉNEMENT -->
                <div class="mt-6 p-4 bg-teal-50 border border-teal-200 rounded-lg">
                    <label class="block text-sm font-bold text-teal-800 mb-2">🎯 DATE DE L'ÉVÉNEMENT (Jalon final) *</label>
                    <input type="date" name="date_event" required
                           class="block w-full border border-teal-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
            </div>

            <!-- COORDONNÉES PIED DE PAGE -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📞 Coordonnées (Pied de page)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Téléphone</label>
                        <input type="text" name="phone"
                               placeholder="Ex : 04 99 13 63 33"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" name="email"
                               placeholder="Ex : contact@societe.fr"
                               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>
            </div>

            <!-- BOUTON GÉNÉRATION -->
            <div class="text-center space-y-3">
                <button type="submit"
                        class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transition transform hover:scale-105 text-lg">
                    ⚡ GÉNÉRER LE PNG GRATUITEMENT
                </button>
                <div>
                    <a href="/admin/logout" class="text-sm text-slate-400 hover:text-red-500 transition">
                        🚪 Se déconnecter
                    </a>
                </div>
            </div>

        </form>
    </div>
</body>
</html>
