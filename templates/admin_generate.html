<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Générateur Gratuit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        input[type="color"] { width: 48px; height: 48px; border: none; border-radius: 8px; cursor: pointer; padding: 2px; background: none; }
        .color-box { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">🛠️ Espace Admin</h1>
                <p class="text-teal-600 font-semibold">Génération gratuite et immédiate (sans paiement)</p>
            </div>
            <a href="/admin/logout" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-lg text-sm transition">Déconnexion</a>
        </header>

        <form action="/admin/generate" method="POST" class="space-y-6">

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📌 Événement</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Nom du client</label>
                        <input type="text" name="client" required placeholder="Ex : Mairie de Lyon" class="mt-1 block w-full rounded-md border-slate-300 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Nom de l'événement</label>
                        <input type="text" name="evenement" required placeholder="Ex : Salon du Marketing 2026" class="mt-1 block w-full rounded-md border-slate-300 border p-2">
                    </div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📋 Les 4 étapes clés</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 1</span>
                        <input type="text" name="label1" placeholder="Ex : Validation commande" class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date1" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 2</span>
                        <input type="text" name="label2" placeholder="Ex : Validation BAT" class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date2" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 3</span>
                        <input type="text" name="label3" placeholder="Ex : Production" class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date3" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 4</span>
                        <input type="text" name="label4" placeholder="Ex : Expédition" class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date4" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                </div>
                <div class="mt-6 p-4 bg-teal-50 border border-teal-200 rounded-lg">
                    <label class="block text-sm font-bold text-teal-800">🎯 DATE DE L'ÉVÉNEMENT (Jalon final)</label>
                    <input type="date" name="date_event" required class="mt-1 block w-full rounded-md border-teal-300 border p-2">
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-2 text-teal-700">🎨 Couleurs</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Couleur principale</label>
                        <div class="color-box">
                            <input type="color" id="color1" name="color_main" value="#3F8078">
                            <input type="text" id="hex1" value="#3F8078" maxlength="7" class="flex-1 text-sm border border-slate-300 rounded p-1 font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Couleur secondaire</label>
                        <div class="color-box">
                            <input type="color" id="color2" name="color_alt" value="#75A097">
                            <input type="text" id="hex2" value="#75A097" maxlength="7" class="flex-1 text-sm border border-slate-300 rounded p-1 font-mono">
                        </div>
                    </div>
                </div>
                <div class="mt-4 flex rounded-full overflow-hidden h-4 w-full shadow-inner">
                    <div id="prev1" class="flex-1" style="background:#3F8078; border-radius: 8px 0 0 8px;"></div>
                    <div id="prev2" class="flex-1" style="background:#75A097;"></div>
                    <div id="prev3" class="flex-1" style="background:#3F8078;"></div>
                    <div id="prev4" class="flex-1" style="background:#75A097; border-radius: 0 8px 8px 0;"></div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📞 Pied de page</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="footer_societe" placeholder="Nom de la société" class="block w-full rounded-md border-slate-300 border p-2">
                    <input type="text" name="phone" placeholder="Téléphone" class="block w-full rounded-md border-slate-300 border p-2">
                    <input type="email" name="email" placeholder="Email" class="block w-full rounded-md border-slate-300 border p-2">
                    <input type="text" name="website" placeholder="Site web" class="block w-full rounded-md border-slate-300 border p-2">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition">
                    🚀 GÉNÉRER LE PNG GRATUITEMENT
                </button>
            </div>
        </form>
    </div>
    <script>
        const c1 = document.getElementById('color1'), h1 = document.getElementById('hex1');
        const c2 = document.getElementById('color2'), h2 = document.getElementById('hex2');
        function updatePreview() {
            document.getElementById('prev1').style.background = c1.value;
            document.getElementById('prev3').style.background = c1.value;
            document.getElementById('prev2').style.background = c2.value;
            document.getElementById('prev4').style.background = c2.value;
        }
        c1.addEventListener('input', () => { h1.value = c1.value; updatePreview(); });
        c2.addEventListener('input', () => { h2.value = c2.value; updatePreview(); });
        h1.addEventListener('input', () => { if(/^#[0-9A-Fa-f]{6}$/.test(h1.value)){c1.value=h1.value;updatePreview();} });
        h2.addEventListener('input', () => { if(/^#[0-9A-Fa-f]{6}$/.test(h2.value)){c2.value=h2.value;updatePreview();} });
    </script>
</body>
</html>
