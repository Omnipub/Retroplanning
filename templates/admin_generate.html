<!DOCTYPE html>  
<html lang="fr">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Admin - Générateur Gratuit</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  
    <style>  
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }  
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }  
    </style>  
</head>  
<body class="p-4 md:p-8">  
    <div class="max-w-4xl mx-auto">  
        <header class="flex justify-between items-center mb-10">  
            <div>  
                <h1 class="text-3xl font-bold text-slate-800">🛠️ Espace Admin</h1>  
                <p class="text-teal-600 font-semibold">Génération gratuite et immédiate (sans paiement)</p>  
            </div>  
            <a href="/admin/logout" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-lg text-sm transition">  
                Déconnexion  
            </a>  
        </header>

        <form action="/admin/generate" method="POST" class="space-y-6">  
            <div class="card p-6">  
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📌 Événement</h2>  
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">  
                    <div>  
                        <label class="block text-sm font-medium text-slate-700">Nom du client</label>  
                        <input type="text" name="client" required class="mt-1 block w-full rounded-md border-slate-300 border p-2">  
                    </div>  
                    <div>  
                        <label class="block text-sm font-medium text-slate-700">Nom de l'événement</label>  
                        <input type="text" name="evenement" required class="mt-1 block w-full rounded-md border-slate-300 border p-2">  
                    </div>  
                </div>  
            </div>

            <div class="card p-6">  
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📋 Les 4 étapes clés</h2>  
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">  
                    {% for i in range(1, 5) %}  
                    <div class="p-3 border rounded-lg bg-slate-50">  
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape {{ i }}</span>  
                        <input type="text" name="label{{ i }}" placeholder="Libellé" class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">  
                        <input type="date" name="date{{ i }}" required class="block w-full text-sm border-slate-300 rounded-md border p-1">  
                    </div>  
                    {% endfor %}  
                </div>  
                <div class="mt-6 p-4 bg-teal-50 border border-teal-200 rounded-lg">  
                    <label class="block text-sm font-bold text-teal-800">🎯 DATE DE L'ÉVÉNEMENT (Jalon final)</label>  
                    <input type="date" name="date_event" required class="mt-1 block w-full rounded-md border-teal-300 border p-2">  
                </div>  
            </div>

            <div class="card p-6">  
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📞 Coordonnées (Pied de page)</h2>  
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">  
                    <input type="text" name="phone" placeholder="Téléphone" class="block w-full rounded-md border-slate-300 border p-2">  
                    <input type="email" name="email" placeholder="Email" class="block w-full rounded-md border-slate-300 border p-2">  
                </div>  
            </div>

            <div class="text-center">  
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition">  
                    🚀 GÉNÉRER LE PNG GRATUITEMENT  
                </button>  
            </div>  
        </form>  
    </div>  
</body>  
</html>
