<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Rétroplanning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800">🗓️ RÉTROPLANNING EN LIGNE</h1>
            <p class="text-slate-600 mt-2">Créez votre document professionnel en quelques clics · <strong>{{ prix }}€ TTC</strong></p>
        </header>

        <form action="/checkout" method="POST" class="space-y-6">
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📌 Votre événement</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Nom du client</label>
                        <input type="text" name="client" required placeholder="Ex : Mairie de Lyon"
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Nom de l'événement</label>
                        <input type="text" name="evenement" required placeholder="Ex : Salon du Marketing 2026"
                               class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
                    </div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📋 Les 4 étapes clés</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 1</span>
                        <input type="text" name="label1" placeholder="Ex : Validation commande"
                               class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date1" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 2</span>
                        <input type="text" name="label2" placeholder="Ex : Validation BAT"
                               class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date2" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 3</span>
                        <input type="text" name="label3" placeholder="Ex : Production"
                               class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date3" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                    <div class="p-3 border rounded-lg bg-slate-50">
                        <span class="text-xs font-bold text-slate-400 uppercase">Étape 4</span>
                        <input type="text" name="label4" placeholder="Ex : Expédition"
                               class="mt-1 block w-full text-sm border-slate-300 rounded-md border p-1 mb-2">
                        <input type="date" name="date4" required class="block w-full text-sm border-slate-300 rounded-md border p-1">
                    </div>
                </div>
                <div class="mt-6 p-4 bg-teal-50 border border-teal-200 rounded-lg">
                    <label class="block text-sm font-bold text-teal-800">🎯 DATE DE L'ÉVÉNEMENT (Jalon final)</label>
                    <input type="date" name="date_event" required
                           class="mt-1 block w-full rounded-md border-teal-300 border p-2">
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 text-teal-700">📞 Vos coordonnées (Pied de page)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="phone" placeholder="Ex : 04 99 13 63 33"
                           class="block w-full rounded-md border-slate-300 border p-2">
                    <input type="email" name="email" placeholder="Ex : contact@societe.fr"
                           class="block w-full rounded-md border-slate-300 border p-2">
                </div>
            </div>

            <div class="text-center">
                <button type="submit"
                        class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition transform hover:scale-105">
                    💳 PAYER {{ prix }}€ VIA PAYPAL ET GÉNÉRER MON PNG
                </button>
                <p class="text-slate-400 text-sm mt-3">🔒 Paiement sécurisé via PayPal — Téléchargement immédiat après confirmation</p>
            </div>
        </form>
    </div>
</body>
</html>
