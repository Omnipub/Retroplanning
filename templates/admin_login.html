<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Retroplanning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }</style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🔐</div>
            <h1 class="text-2xl font-bold text-slate-800">Accès Administrateur</h1>
            <p class="text-slate-500 text-sm mt-1">Retroplanning.eu — Espace réservé</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Mot de passe</label>
                <input type="password" name="password" required autofocus
                       placeholder="••••••••••••"
                       class="w-full border border-slate-300 rounded-lg px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <button type="submit"
                    class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition">
                🔓 Connexion
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-sm text-slate-400 hover:text-teal-600">← Retour au site public</a>
        </div>
    </div>
</body>
</html>
