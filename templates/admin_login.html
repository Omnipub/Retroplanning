<!DOCTYPE html>  
<html lang="fr">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Connexion Admin</title>  
    <link rel="icon" href="/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png"><link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png"><link rel="stylesheet" href="/static/css/tailwind.css">  
</head>  
<body class="bg-slate-100 flex items-center justify-center h-screen">  
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">  
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">🔒 Accès Administration</h1>  
          
        {% if error %}  
        <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg mb-4 text-sm text-center">  
            {{ error }}  
        </div>  
        {% endif %}

        <form action="/admin" method="POST" class="space-y-4">  
            <div>  
                <label class="block text-sm font-medium text-slate-700">Mot de passe</label>  
                <input type="password" name="password" required autocomplete="off" placeholder="Entrez le mot de passe"  
                       class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2 focus:border-teal-500 focus:ring-teal-500">  
            </div>  
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-md transition">  
                Se connecter  
            </button>  
        </form>  
    </div>  
</body>  
</html>
