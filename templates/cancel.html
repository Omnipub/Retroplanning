<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé</title>
<style>
  :root { --green:#3F8078; --green-dark:#2A5550; --bg:#F4F7F6; --white:#FFFFFF; --gray:#6B7280; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:#1A1A1A; }
  header { background:var(--green); color:var(--white); padding:32px 24px; text-align:center; border-bottom:4px solid var(--green-dark); }
  header h1 { font-size:1.8rem; font-weight:800; }
  .container { max-width:560px; margin:60px auto; padding:0 16px; text-align:center; }
  .card { background:var(--white); border-radius:12px; box-shadow:0 4px 24px rgba(63,128,120,.10); padding:48px 40px; }
  .icon { font-size:4rem; margin-bottom:20px; }
  h2 { color:#E53E3E; font-size:1.5rem; margin-bottom:12px; }
  p { color:var(--gray); margin-bottom:24px; line-height:1.6; }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 32px; border-radius:50px; font-size:1.05rem; font-weight:700;
    background:var(--green); color:var(--white); text-decoration:none; transition:all .2s;
  }
  .btn:hover { background:var(--green-dark); transform:translateY(-2px); }
  footer { text-align:center; padding:24px; font-size:.85rem; color:var(--gray); margin-top:40px; }
</style>
</head>
<body>
<header><h1>❌ Paiement annulé</h1></header>
<div class="container">
  <div class="card">
    <div class="icon">😕</div>
    <h2>Votre paiement a été annulé</h2>
    <p>Aucun montant n'a été débité.<br>Vous pouvez retourner sur le formulaire et recommencer quand vous le souhaitez.</p>
    <a href="/" class="btn">↩️ Retour au formulaire</a>
  </div>
</div>
<footer>Retroplanning de Production &copy; 2026 — Omnipub</footer>
</body>
</html>
