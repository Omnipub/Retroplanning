name: Tests facturation Stripe

on:
  push:
    branches: [ feature/stripe-integration ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer la suite pytest (logique d'acces/quota Stripe)
        run: pytest tests/ -v
